# Render Blueprint: https://render.com/docs/blueprint-spec
# Requisito previo: en la consola de Aiven (Service settings -> Allowed IP
# addresses) añadir 0.0.0.0/0 para permitir conexiones desde Render.

services:
  - type: web
    name: tripcanvas
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      # --- Secretos: se configuran manualmente en el dashboard de Render ---
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      # SSL opcional: la conexión local funciona sin CA (Aiven no lo exige).
      # Solo si quieres verificar el certificado, añade MYSQL_SSL_CA_B64 con el
      # CA de tu proyecto (consola Aiven -> Overview -> CA Certificate) en base64.
      # --- Valores fijos ---
      - key: MYSQL_HOST
        value: tripcanvas-scorvachoa.l.aivencloud.com
      - key: MYSQL_PORT
        value: "10379"
      - key: MYSQL_USER
        value: avnadmin
      - key: MYSQL_DB
        value: defaultdb
