# Render Blueprint: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: tripcanvas
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      # --- Secretos: se configuran manualmente en el dashboard de Render ---
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: TINIFY_API_KEY
        sync: false
