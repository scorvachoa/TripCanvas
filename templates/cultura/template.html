<div class="travel-card" data-template="cultura">
  {{LOGO}}
  <div class="cu-band cu-band-top"></div>
  <div class="cu-badge">CULTURA</div>
  <h1 class="cu-title">{{TITLE}}</h1>
  <p class="cu-body">{{BODY}}</p>
  <ul class="cu-facts">{{FACTS_LIST}}</ul>
  <div class="cu-band cu-band-bottom"></div>
  <div class="cu-footer">
    <span class="cu-destination">{{DESTINATION}}</span>
    <span class="cu-source">{{SOURCE}}</span>
  </div>
</div>
