<div class="travel-card" data-template="quiz">
  {{LOGO}}
  <div class="qz-top">
    <span class="qz-badge">TRIVIA</span>
    <span class="qz-destination">{{DESTINATION}}</span>
  </div>
  <h1 class="qz-question">{{QUESTION}}</h1>
  <div class="qz-options">{{OPTIONS}}</div>
  <div class="qz-footer">
    <span class="qz-hint">¿Cuál es la correcta?</span>
    <span class="qz-source">{{SOURCE}}</span>
  </div>
</div>
