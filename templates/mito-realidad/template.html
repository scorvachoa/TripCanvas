<div class="travel-card" data-template="mito-realidad">
  {{LOGO}}
  <div class="mr-badge">MITO VS REALIDAD</div>
  <h1 class="mr-title">{{TITLE}}</h1>

  <div class="mr-split">
    <div class="mr-side mr-myth">
      <div class="mr-tag mr-tag-myth">MITO</div>
      <p class="mr-text">{{MYTH}}</p>
    </div>
    <div class="mr-divider"></div>
    <div class="mr-side mr-reality">
      <div class="mr-tag mr-tag-reality">REALIDAD</div>
      <p class="mr-text">{{REALITY}}</p>
    </div>
  </div>

  <div class="mr-footer">
    <span>{{DESTINATION}}</span>
    <span class="mr-source">{{SOURCE}}</span>
  </div>
</div>
