<div class="travel-card" data-template="sabias-que">
  {{LOGO}}
  <div class="sq-badge">¿SABÍAS QUE…?</div>
  <h1 class="sq-question">{{QUESTION}}</h1>
  <div class="sq-bubble">
    <span class="sq-arrow"></span>
    <p class="sq-answer">{{ANSWER}}</p>
  </div>
  <div class="sq-watermark" aria-hidden="true">?</div>
  <div class="sq-footer">
    <span class="sq-destination">{{DESTINATION}}</span>
    <span class="sq-source">{{SOURCE}}</span>
  </div>
</div>
