<div class="travel-card" data-template="mejor-epoca">
  {{LOGO}}
  <div class="me-badge">MEJOR ÉPOCA</div>
  <h1 class="me-title">{{TITLE}}</h1>
  <div class="me-seasons">
    <span>ENE</span><span>ABR</span><span>JUL</span><span>OCT</span>
  </div>
  <div class="me-grid">{{FACTS_LIST}}</div>
  <div class="me-footer">
    <span class="me-destination">{{DESTINATION}}</span>
    <span class="me-source">{{SOURCE}}</span>
  </div>
</div>
