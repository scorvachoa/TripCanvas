<div class="travel-card" data-template="guia-rapida">
  {{LOGO}}
  <div class="gr-top">
    <span class="gr-badge">GUÍA RÁPIDA</span>
    <span class="gr-destination">{{DESTINATION}}</span>
  </div>
  <h1 class="gr-title">{{TITLE}}</h1>
  <ul class="gr-facts">{{FACTS_LIST}}</ul>
  <div class="gr-footer">
    <span class="gr-source">{{SOURCE}}</span>
  </div>
</div>
