<div class="travel-card" data-template="comparativa">
  {{LOGO}}
  <div class="cp-emblem" aria-hidden="true">VS</div>
  <div class="cp-badge">COMPARATIVA</div>
  <h1 class="cp-title">{{TITLE}}</h1>
  <p class="cp-body">{{BODY}}</p>
  <div class="cp-table">{{ITEMS}}</div>
  <div class="cp-footer">
    <span class="cp-destination">{{DESTINATION}}</span>
    <span class="cp-source">{{SOURCE}}</span>
  </div>
</div>
