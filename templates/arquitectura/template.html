<div class="travel-card" data-template="arquitectura">
  {{LOGO}}
  <span class="ar-cross ar-cross-tl"></span>
  <span class="ar-cross ar-cross-tr"></span>
  <span class="ar-cross ar-cross-bl"></span>
  <span class="ar-cross ar-cross-br"></span>
  <div class="ar-top">
    <span class="ar-spec">DETALLE TÉCNICO</span>
    <span class="ar-num">Nº {{NUMBER}}</span>
  </div>
  <h1 class="ar-title">{{TITLE}}</h1>
  <p class="ar-body">{{BODY}}</p>
  <div class="ar-sheet">{{FACTS_LIST}}</div>
  <div class="ar-footer">
    <span class="ar-destination">{{DESTINATION}}</span>
    <span class="ar-source">{{SOURCE}}</span>
  </div>
</div>
