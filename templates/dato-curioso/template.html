<div class="travel-card" data-template="dato-curioso">
  {{LOGO}}
  <div class="dc-bg">
    <div class="dc-image" style="background-image:url('{{IMAGE}}')"></div>
    <div class="dc-overlay"></div>
  </div>

  <div class="dc-badge">DATO CURIOSO</div>

  <div class="dc-content">
    <h1 class="dc-title">{{TITLE}}</h1>
    <p class="dc-body">{{BODY}}</p>
  </div>

  <div class="dc-footer">
    <span class="dc-pin">📍</span>
    <span class="dc-destination">{{DESTINATION}}</span>
    <span class="dc-dot">•</span>
    <span class="dc-source">{{SOURCE}}</span>
  </div>
</div>
