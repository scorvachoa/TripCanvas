<div class="travel-card" data-template="historia">
  {{LOGO}}
  <div class="hi-kicker">
    <span class="hi-rule"></span>
    <span class="hi-label">CRÓNICA</span>
    <span class="hi-rule"></span>
  </div>
  <div class="hi-date">{{DATE}}</div>
  <h1 class="hi-title">{{TITLE}}</h1>
  <div class="hi-ornament"></div>
  <p class="hi-body">{{BODY}}</p>
  <div class="hi-footer">
    <span class="hi-destination">{{DESTINATION}}</span>
    <span class="hi-source">{{SOURCE}}</span>
  </div>
</div>
