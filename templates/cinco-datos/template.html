<div class="travel-card" data-template="cinco-datos">
  {{LOGO}}
  <div class="cd-top">
    <span class="cd-label">TOP 5</span>
    <span class="cd-destination">{{DESTINATION}}</span>
  </div>

  <h1 class="cd-title">{{TITLE}}</h1>

  <ul class="cd-facts">
    {{FACTS_LIST}}
  </ul>

  <div class="cd-footer">
    <span class="cd-source">{{SOURCE}}</span>
    <span class="cd-brand">TRIPCANVAS</span>
  </div>
</div>
