<div class="travel-card" data-template="informacion-general">
  {{LOGO}}
  <div class="ig-stamp" aria-label="Información">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="10" stroke="#1a1205" stroke-width="1.6" opacity="0.7" />
      <path d="M12 11v5.2" stroke="#1a1205" stroke-width="2.4" stroke-linecap="round" />
      <circle cx="12" cy="7.4" r="1.4" fill="#1a1205" />
    </svg>
  </div>
  <div class="ig-badge">PERFIL DEL DESTINO</div>
  <h1 class="ig-title">{{TITLE}}</h1>
  <p class="ig-body">{{BODY}}</p>
  <ul class="ig-sheet">{{FACTS_LIST}}</ul>
  <div class="ig-footer">
    <span class="ig-destination">{{DESTINATION}}</span>
    <span class="ig-source">{{SOURCE}}</span>
  </div>
</div>
