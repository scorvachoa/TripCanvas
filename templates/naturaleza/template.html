<div class="travel-card" data-template="naturaleza">
  {{LOGO}}
  <div class="na-sun" aria-hidden="true"></div>
  <div class="na-badge">NATURALEZA</div>
  <h1 class="na-title">{{TITLE}}</h1>
  <p class="na-body">{{BODY}}</p>
  <ul class="na-facts">{{FACTS_LIST}}</ul>
  <div class="na-hills" aria-hidden="true">
    <span class="na-hill na-hill-back"></span>
    <span class="na-hill na-hill-front"></span>
  </div>
  <div class="na-footer">
    <span class="na-destination">{{DESTINATION}}</span>
    <span class="na-source">{{SOURCE}}</span>
  </div>
</div>
