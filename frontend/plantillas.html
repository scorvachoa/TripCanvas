<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Plantillas — TripCanvas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <a href="/" class="brand">
        <span class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></span>
        <span class="brand-text">
          <span class="brand-name">TripCanvas</span>
          <span class="brand-sub">AI Travel Content Studio</span>
        </span>
      </a>
      <nav class="main-nav" id="main-nav">
        <a href="/" class="nav-link">Inicio</a>
        <a href="/crear" class="nav-link">Crear</a>
        <a href="/plantillas" class="nav-link active">Plantillas</a>
      </nav>
      <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg></button>
    </div>
  </header>

  <main class="page">

    <div class="page-head">
      <h1>Plantillas</h1>
      <p>Elige el diseño de tus tarjetas. Todas se adaptan a vertical, cuadrado y story.</p>
    </div>

    <div id="templates-grid" class="template-grid"></div>

  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></span>
        <span>
          <span class="brand-name">TripCanvas</span>
          <span class="brand-sub">AI Travel Content Studio</span>
        </span>
      </div>
      <nav class="footer-nav">
        <a href="/">Inicio</a>
        <a href="/crear">Crear</a>
        <a href="/plantillas">Plantillas</a>
      </nav>
      <p class="footer-note">Tarjetas de viaje generadas con inteligencia artificial y empaquetadas para tu feed.</p>
    </div>
  </footer>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/generator.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        App.setActiveNav();
        App.setupMobileNav();
        await App.renderTemplates('templates-grid');
      } catch (err) {
        console.error(err);
        App.toast('No se pudo conectar con el servidor.', 'error');
      }
    });
  </script>
</body>
</html>
