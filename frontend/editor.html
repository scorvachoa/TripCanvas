<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Editor — TripCanvas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <a href="/" class="brand">
        <span class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></span>
        <span class="brand-text">
          <span class="brand-name">TripCanvas</span>
          <span class="brand-sub">AI Travel Content Studio</span>
        </span>
      </a>
      <nav class="main-nav" id="main-nav">
        <a href="/" class="nav-link">Inicio</a>
        <a href="/crear" class="nav-link">Crear</a>
        <a href="/plantillas" class="nav-link">Plantillas</a>
      </nav>
      <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg></button>
    </div>
  </header>

  <main class="page page-editor">

    <div class="editor-toolbar">
      <div class="editor-nav">
        <button class="btn btn-ghost btn-sm" id="btn-back">← Volver</button>
        <span class="editor-title" id="editor-project-name">Proyecto nuevo</span>
      </div>
      <div class="editor-toolbar-actions">
        <span class="editor-card-counter" id="editor-card-counter">Tarjeta 1 / 1</span>
        <button class="btn btn-ghost btn-sm" id="btn-prev">← anterior</button>
        <button class="btn btn-ghost btn-sm" id="btn-next">siguiente →</button>
        <button class="btn btn-secondary btn-sm" id="btn-save"><span class="btn-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></span> Guardar</button>
        <button class="btn btn-ghost btn-sm" id="btn-download-project"><span class="btn-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="16" x2="12" y2="3"/></svg></span> Descargar proyecto</button>
        <label class="btn btn-ghost btn-sm" id="btn-upload-project-label"><span class="btn-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span> Subir proyecto<input type="file" id="btn-upload-project" accept=".json" class="file-input-hidden"></label>
        <button class="btn btn-primary btn-sm" id="btn-export-all"><span class="btn-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="16" x2="12" y2="3"/></svg></span> Descargar todas</button>
      </div>
    </div>

    <div class="editor-layout">
      <aside class="editor-left panel">
        <div class="panel-title">Contenido</div>
        <div class="panel-scroll">
          <div class="field">
            <label for="e-destination">Destino</label>
            <input type="text" id="e-destination" placeholder="Ej. Machu Picchu, Cusco">
          </div>
          <div class="field" data-editor-field="title">
            <label for="e-title">Título</label>
            <textarea id="e-title" rows="3"></textarea>
          </div>
          <div class="field" data-editor-field="body">
            <label for="e-body">Descripción</label>
            <textarea id="e-body" rows="4"></textarea>
          </div>
          <div class="field" data-editor-field="question">
            <label for="e-question">Pregunta</label>
            <textarea id="e-question" rows="2"></textarea>
          </div>
          <div class="field" data-editor-field="answer">
            <label for="e-answer">Respuesta</label>
            <textarea id="e-answer" rows="2"></textarea>
          </div>
          <div class="field" data-editor-field="myth">
            <label for="e-myth">Mito</label>
            <textarea id="e-myth" rows="2"></textarea>
          </div>
          <div class="field" data-editor-field="reality">
            <label for="e-reality">Realidad</label>
            <textarea id="e-reality" rows="2"></textarea>
          </div>
          <div class="field" data-editor-field="facts" id="facts-field">
            <label for="e-facts">Datos (uno por línea)</label>
            <textarea id="e-facts" rows="5"></textarea>
          </div>
          <div class="field" data-editor-field="location">
            <label for="e-location">Ubicación</label>
            <input type="text" id="e-location">
          </div>
          <div class="field">
            <label for="e-source">Fuente</label>
            <input type="text" id="e-source">
          </div>
        </div>
      </aside>

      <div class="editor-center">
        <div class="preview-stage" id="preview-stage">
          <div class="preview-card" id="preview-card"></div>
        </div>
        <div class="preview-toolbar">
          <button class="btn btn-ghost btn-sm" id="btn-export-one">Exportar PNG</button>
          <button class="btn btn-ghost btn-sm" id="btn-copy-copy"><span class="btn-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></span> Copiar copy</button>
        </div>
      </div>

      <aside class="editor-right panel">
        <div class="panel-title">Diseño</div>
        <div class="panel-scroll">
          <div class="field">
            <label for="d-template">Plantilla</label>
            <select id="d-template"></select>
          </div>
          <div class="field">
            <label for="d-format">Formato</label>
            <select id="d-format">
              <option value="instagram_portrait">Instagram Portrait · 1080×1350</option>
              <option value="square">Square · 1080×1080</option>
              <option value="story">Story · 1080×1920</option>
            </select>
          </div>
          <div class="field">
            <label for="d-font">Tipografía</label>
            <select id="d-font">
              <option value="'Poppins','Segoe UI',sans-serif">Poppins</option>
              <option value="'Inter','Segoe UI',sans-serif">Inter</option>
              <option value="'Playfair Display',serif">Playfair Display</option>
              <option value="'Montserrat','Segoe UI',sans-serif">Montserrat</option>
              <option value="'Oswald','Segoe UI',sans-serif">Oswald</option>
            </select>
          </div>
          <div class="color-row">
            <div class="color-item">
              <div class="color-circle" id="d-bg-circle" style="background:#0f1a2e;cursor:pointer" onclick="BackgroundPicker.open()">
                <input type="color" id="d-bg" value="#0f1a2e" class="file-input-hidden">
              </div>
              <span class="color-label">Fondo</span>
            </div>
            <div class="color-item">
              <div class="color-circle" id="d-text-circle" style="background:#ffffff">
                <input type="color" id="d-text" value="#ffffff">
              </div>
              <span class="color-label">Texto</span>
            </div>
            <div class="color-item">
              <div class="color-circle" id="d-accent-circle" style="background:#f4b942">
                <input type="color" id="d-accent" value="#f4b942">
              </div>
              <span class="color-label">Acento</span>
            </div>
          </div>
          <div class="field">
            <label for="d-overlay">Overlay <span id="d-overlay-val">0.35</span></label>
            <input type="range" id="d-overlay" min="0" max="1" step="0.05" value="0.35">
          </div>
          <div class="field">
            <label for="d-text-scale">Tamaño de texto <span id="d-text-scale-val">100%</span></label>
            <input type="range" id="d-text-scale" min="0.8" max="1.5" step="0.05" value="1">
          </div>
          <div class="field">
            <label for="d-image">Imagen</label>
            <input type="text" id="d-image" placeholder="URL de imagen">
            <label for="d-image-file" class="btn btn-ghost btn-sm btn-upload">
              <span class="btn-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></span> Seleccionar archivo
            </label>
            <input type="file" id="d-image-file" accept="image/*" class="file-input-hidden">
          </div>
          <div class="field toggle-field">
            <label for="d-logo">Logo TripCanvas</label>
            <label class="switch">
              <input type="checkbox" id="d-logo" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </aside>
    </div>

  </main>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <h3>Editar proyecto</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="modal-name">Nombre</label>
          <input type="text" id="modal-name" placeholder="Nombre del proyecto">
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="modal-cancel">Cancelar</button>
        <button class="btn btn-primary" id="modal-save">Guardar</button>
      </div>
    </div>
  </div>

  <div id="edit-field-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <h3 id="edit-field-title">Editar texto</h3>
        <button class="modal-close" id="edit-field-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <textarea id="edit-field-input" rows="4"></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="edit-field-cancel">Cancelar</button>
        <button class="btn btn-primary" id="edit-field-save">Aplicar</button>
      </div>
    </div>
  </div>

  <div id="bg-picker-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <h3>Seleccionar fondo</h3>
        <button class="modal-close" id="bg-picker-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="tabs">
          <button class="tab active" data-tab="presets">Preestablecidos</button>
          <button class="tab" data-tab="custom">Color personalizado</button>
        </div>
        <div class="tab-content active" id="tab-presets">
          <div class="bg-grid" id="bg-presets-grid"></div>
        </div>
        <div class="tab-content" id="tab-custom">
          <div class="field">
            <label for="bg-custom-color">Color sólido</label>
            <div class="color-row">
              <div class="color-item">
                <div class="color-circle" id="bg-custom-circle" style="background:#0f1a2e">
                  <input type="color" id="bg-custom-color" value="#0f1a2e">
                </div>
              </div>
            </div>
          </div>
          <div class="field">
            <label for="bg-custom-hex">Código HEX</label>
            <input type="text" id="bg-custom-hex" value="#0f1a2e" placeholder="#000000">
          </div>
          <button class="btn btn-primary" id="bg-custom-apply" style="width:100%">Aplicar color</button>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="bg-picker-cancel">Cancelar</button>
        <button class="btn btn-primary" id="bg-picker-apply">Aplicar</button>
      </div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/bg-picker.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/export.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        App.setActiveNav();
        App.setupMobileNav();
        await Generator.init();
        await App.setupTemplateSelect('d-template');
        Editor.init();
        await Editor.bootstrap();
        BackgroundPicker.init();

        document.getElementById('btn-export-one').addEventListener('click', () => Exporter.exportOne());
        document.getElementById('btn-export-all').addEventListener('click', () => Exporter.exportAll());
        document.getElementById('btn-copy-copy').addEventListener('click', () => Exporter.copyCopyText());
        document.getElementById('modal-close').addEventListener('click', () => Editor.hideModal());
        document.getElementById('modal-cancel').addEventListener('click', () => Editor.hideModal());
        document.getElementById('modal-save').addEventListener('click', () => Editor.save());

        window.addEventListener('beforeunload', (e) => {
          if (App.state && App.state._dirty) {
            e.preventDefault();
            e.returnValue = '';
          }
        });
        window.addEventListener('resize', () => fitPreview());
      } catch (err) {
        console.error(err);
        App.toast('No se pudo abrir el editor.', 'error');
      }
    });
  </script>
</body>
</html>
